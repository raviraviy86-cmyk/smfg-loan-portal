
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMFG Loan Portal</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6fb;margin:0;padding:20px;color:#17233c}
main{max-width:460px;margin:20px auto;background:white;padding:24px;border-radius:14px;box-shadow:0 4px 18px #0001}
h1{color:#155eef}
input,select,button{width:100%;box-sizing:border-box;padding:13px;margin-top:12px;border-radius:8px;font-size:16px}
input,select{border:1px solid #ccd3df}
button{background:#155eef;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.secondary{background:#526176}
.notice{color:#596579;line-height:1.6;overflow-wrap:anywhere}
.item{border:1px solid #dce3ee;padding:12px;margin-top:12px;border-radius:8px}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>SMFG Loan Portal</h1>
<p class="notice">Apply for a loan and securely view your own applications.</p>

<section id="authSection">
<h3>Applicant Login / Sign Up</h3>
<form id="authForm">
<input id="email" type="email" required placeholder="Email address" autocomplete="email">
<input id="password" type="password" required minlength="8" placeholder="Password (minimum 8 characters)" autocomplete="current-password">
<button type="submit" id="loginBtn">Login</button>
</form>
<button id="signupBtn" type="button" class="secondary">Create Applicant Account</button>
</section>

<section id="appSection" class="hidden">
<p id="welcome" class="notice"></p>
<button id="logoutBtn" class="secondary" type="button">Logout</button>

<h3>Apply for Loan</h3>
<form id="loanForm">
<label for="name">Full Name</label>
<input id="name" required maxlength="100" placeholder="Enter full name">

<label for="phone">Phone Number</label>
<input id="phone" type="tel" required maxlength="20" placeholder="Enter phone number">

<label for="loan">Loan Type</label>
<select id="loan" required>
<option value="">Select loan type</option>
<option>Personal Loan</option>
<option>Business Loan</option>
<option>Home Loan</option>
</select>

<label for="amount">Requested Amount</label>
<input id="amount" type="number" min="1" required placeholder="Enter amount">

<button id="submitBtn" type="submit">Submit Application</button>
</form>

<p id="loanMessage" class="notice" aria-live="polite"></p>
<hr>
<h3>My Applications</h3>
<button id="refreshBtn" type="button" class="secondary">Refresh Applications</button>
<div id="applications"></div>
</section>

<p id="message" class="notice" aria-live="polite"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = window.supabase.createClient(
  "https://gpaoernivxkhuuwsmtvh.supabase.co",
  "sb_publishable_7TnO-eq3RA2cXx1cdJPLjw_dF2FFHz3"
);

const $ = id => document.getElementById(id);
let currentUser = null;

function showMessage(text) {
  $("message").textContent = text;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[ch]);
}

async function updateScreen(user) {
  currentUser = user;
  $("authSection").classList.toggle("hidden", !!user);
  $("appSection").classList.toggle("hidden", !user);
  $("welcome").textContent = user ? "Signed in: " + user.email : "";
  showMessage("");

  if (user) await loadApplications();
}

async function loadApplications() {
  if (!currentUser) return;

  $("applications").textContent = "Loading applications...";

  const { data, error } = await db
    .from("loan_applicationssmfg")
    .select('*')
    .eq("user_id", currentUser.id)
    .order("Id", { ascending: false });

  if (error) {
    $("applications").textContent =
      "Could not load applications: " + error.message;
    return;
  }

  if (!data.length) {
    $("applications").textContent = "No applications submitted yet.";
    return;
  }

  $("applications").innerHTML = data.map(row => `
    <div class="item">
      <strong>Application ID:</strong> ${escapeHTML(row.Id)}<br>
      <strong>Name:</strong> ${escapeHTML(row["Full name"])}<br>
      <strong>Phone:</strong> ${escapeHTML(row["Phone number"])}<br>
      <strong>Loan Type:</strong> ${escapeHTML(row["Loan type"])}<br>
      <strong>Amount:</strong> ${escapeHTML(row["Loan amount"])}<br>
      <strong>Status:</strong> ${escapeHTML(row.Status)}
    </div>
  `).join("");
}

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();
  const btn = $("loginBtn");
  btn.disabled = true;
  showMessage("Signing in...");

  try {
    const { error } = await db.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });
    if (error) throw error;
    showMessage("");
  } catch (error) {
    showMessage(error.message);
  } finally {
    btn.disabled = false;
  }
});

$("signupBtn").addEventListener("click", async () => {
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || password.length < 8) {
    showMessage("Enter your email and a password of at least 8 characters.");
    return;
  }

  $("signupBtn").disabled = true;
  showMessage("Creating account...");

  try {
    const { data, error } = await db.auth.signUp({ email, password });
    if (error) throw error;

    if (data.session) {
      await updateScreen(data.session.user);
      showMessage("Account created successfully.");
    } else {
      showMessage("Account created. Check your email to confirm, then log in.");
    }
  } catch (error) {
    showMessage(error.message);
  } finally {
    $("signupBtn").disabled = false;
  }
});

$("loanForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!currentUser) {
    $("loanMessage").textContent = "Please log in first.";
    return;
  }

  const btn = $("submitBtn");
  btn.disabled = true;
  $("loanMessage").textContent = "Submitting...";

  try {
    const record = {
      "Full name": $("name").value.trim(),
      "Phone number": $("phone").value.trim(),
      "Loan type": $("loan").value,
      "Loan amount": Number($("amount").value),
      "Status": "Pending",
      "user_id": currentUser.id
    };

    const { error } = await db
      .from("loan_applicationssmfg")
      .insert(record);

    if (error) throw error;

    $("loanForm").reset();
    $("loanMessage").textContent = "Application submitted successfully.";
    await loadApplications();
  } catch (error) {
    $("loanMessage").textContent = "Submission failed: " + error.message;
  } finally {
    btn.disabled = false;
  }
});

$("logoutBtn").addEventListener("click", async () => {
  const { error } = await db.auth.signOut();
  if (error) {
    showMessage(error.message);
    return;
  }
  await updateScreen(null);
});

$("refreshBtn").addEventListener("click", loadApplications);

db.auth.onAuthStateChange((event, session) => {
  if (event === "INITIAL_SESSION" || event === "SIGNED_IN" ||
      event === "SIGNED_OUT" || event === "USER_UPDATED") {
    updateScreen(session?.user ?? null);
  }
});
</script>
</body>
</html>
