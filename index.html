
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMFG Loan Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      margin: 0;
      padding: 24px 16px;
      color: #17233c;
    }
    main {
      max-width: 460px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000012;
    }
    h1 { color: #155eef; }
    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input, select { border: 1px solid #ccd3df; }
    button {
      background: #155eef;
      color: white;
      border: 0;
      font-weight: bold;
    }
    button:disabled { opacity: 0.6; }
    .notice { color: #596579; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>SMFG Loan Portal</h1>
    <p class="notice">
      Welcome to SMFG Fintech. Loan enquiry demonstration.
    </p>

    <form id="loanForm">
      <label for="name">Full Name</label>
      <input id="name" required maxlength="100"
        placeholder="Enter your name">

      <label for="phone">Phone Number</label>
      <input id="phone" type="tel" required
        maxlength="20" placeholder="Enter phone number">

      <label for="loan">Loan Type</label>
      <select id="loan" required>
        <option value="">Select loan type</option>
        <option>Personal Loan</option>
        <option>Business Loan</option>
        <option>Home Loan</option>
      </select>

      <label for="amount">Requested Amount</label>
      <input id="amount" type="number" min="1"
        required placeholder="Enter amount">

      <button id="submitBtn" type="submit">
        Submit Loan Enquiry
      </button>
    </form>

    <p id="message" class="notice" aria-live="polite"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      "https://gpaoernivxkhuuwsmtvh.supabase.co",
      "sb_publishable_7TnO-eq3RA2cXx1cdJPLjw_dF2FFHz3"
    );

    const form = document.getElementById("loanForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitBtn");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "Submitting...";

     const record = {
  "Full name": document.getElementById("name").value.trim(),
  "Phone number": document.getElementById("phone").value.trim(),
  "Loan type": document.getElementById("loan").value,
  "Loan amount": Number(document.getElementById("amount").value),
  "Status": "Pending"
      };

      try {
        const { error } = await supabaseClient
          .from("loan_applicationssmfg")
          .insert(record);

        if (error) throw error;

        message.textContent =
          "Enquiry submitted successfully!";
        form.reset();
      } catch (error) {
        console.error(error);
        message.textContent =
          "Submission failed. Please check the database columns and access policy.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
